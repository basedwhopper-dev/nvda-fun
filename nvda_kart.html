<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rack Prix</title>
<link rel="stylesheet" href="nvda.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #07080c; }
  canvas { display: block; width: 100%; height: 100%; }
  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 2;
    display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; pointer-events: none;
  }
  a.back { pointer-events: auto; color: var(--green); text-decoration: none; font-size: 13px; }
  .stat { color: #fff; font-weight: 800; font-size: 22px; text-shadow: 0 2px 0 #000; }
  .sub { color: #c5d0b8; font-size: 13px; }
  .help { position: fixed; left: 14px; right: 14px; bottom: 8px; color: #8d9786; font-size: 12px; pointer-events: none; z-index: 2; }
  .overlay {
    position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
    background: rgba(5,6,8,0.62); padding: 18px;
  }
  .overlay.hidden { display: none; }
  .card {
    width: min(760px, 100%);
    max-height: min(86vh, 820px);
    overflow: auto;
    background: #10140a; border: 4px solid #1a2214;
    box-shadow: inset 0 0 0 1px rgba(118,185,0,0.55);
    padding: 22px 22px 18px; text-align: center;
  }
  .card h1 { margin: 0 0 6px; color: var(--green); letter-spacing: 0.14em; font-size: 18px; }
  .card p { margin: 0 0 12px; color: #d5deca; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .choices button { min-width: 132px; text-align: left; }
  .choices button small { display: block; color: #9aa58c; font-size: 11px; font-weight: 500; }
  .choices button.off { opacity: 0.38; }
  .choices button.on { background: var(--green); color: #10140a; }
  .choices button.on small { color: #243018; }
  table.sheet { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 14px; }
  table.sheet td { padding: 5px 8px; border-bottom: 1px solid rgba(118,185,0,0.18); text-align: left; }
  table.sheet tr.you td { color: #d6ff6a; font-weight: 800; }
  button.primary { background: var(--green); color: #10140a; font-weight: 800; border: 0; }
  .choices.roster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .choices.roster button.face { padding: 0 0 8px; text-align: center; min-width: 0; background: #0c100c; }
  .choices.roster button.face img { width: 100%; height: 112px; object-fit: cover; object-position: center 12%; display: block; background: #161616; }
  .choices.roster button.face b { display: block; margin-top: 6px; letter-spacing: 0.04em; font-size: 12px; line-height: 1.2; }
  .choices.roster button.face.on { box-shadow: inset 0 0 0 3px var(--green); background: #17200f; }
  .roomcode { width: 100%; font-size: 34px; letter-spacing: 0.32em; color: var(--green); font-weight: 800; margin: 4px 0 8px; }
  .roomlist { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; text-align: left; }
  .roomrow { display: flex; align-items: center; gap: 8px; color: #d5deca; }
  .roomrow img { width: 42px; height: 42px; object-fit: cover; object-position: center 12%; background: #161616; }
  .roomrow.you span { color: #d6ff6a; font-weight: 800; }
  .roompick { width: 100%; margin: 8px 0; }
  select.course, select.cc {
    font: inherit; color: #d5deca; background: #0c100c; border: 1px solid rgba(118,185,0,0.45);
    padding: 8px; margin: 4px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div>
    <a class="back" href="nvda_menu.html">NVDA</a>
    <div class="sub" id="lap">Rack Prix</div>
  </div>
  <div style="text-align:right">
    <div class="stat" id="place"></div>
    <div class="sub" id="coins"></div>
  </div>
</div>
<div class="help" id="help">W gas · A D steer · S brake · Shift hop · Space item · Esc pause</div>
<div class="overlay" id="overlay">
  <div class="card">
    <h1 id="title">RACK PRIX</h1>
    <p id="blurb"></p>
    <div class="choices" id="choices"></div>
  </div>
</div>
<script src="kart-tracks.js?v=16"></script>
<script src="kart-items.js"></script>
<script src="kart-drivers.js?v=10"></script>
<script src="tt/board-client.js?v=1"></script>
<script src="kart-net.js?v=1"></script>
<script src="kart-prix.js"></script>
<script src="kart-battle.js"></script>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var keys = {};
  var imgs = {};
  var racers = [];
  var boxes = [];
  var traps = [];
  var shots = [];
  var track = null;
  var phase = "menu";
  var rearOn = false;
  var count = 0;
  var raceT = 0;
  var ended = false;
  var split = false;
  var last = 0;
  var session = null;
  var career = loadCareer();
  var netHost = false;
  var inputSeq = 0;
  var inputLog = [];
  var lastSendAt = 0;
  var lastSendKey = "";
  var pendingSnap = null;
  var snapAcc = 0;
  var snapSeq = 0;
  var lastSnapN = 0;
  var viewBuf = {};
  var showedResult = false;
  var connectTimer = null;

  function need(src, pri) {
    if (!imgs[src]) {
      var im = new Image();
      if (pri) im.fetchPriority = pri;
      im.decoding = "async";
      im.src = src;
      imgs[src] = im;
    } else if (pri === "high" && imgs[src].fetchPriority !== "high") {
      imgs[src].fetchPriority = "high";
    }
    return imgs[src];
  }
  function coursePlates(art) {
    var sky = "game-art/fast/race-horizon.jpg";
    var road = "game-art/fast/race-asphalt.jpg";
    if (art === "beach" || art === "plain") { sky = "game-art/fast/world-plain.jpg"; road = "game-art/fast/road-plain.jpg"; }
    else if (art === "choco" || art === "castle") { sky = "game-art/fast/world-castle.jpg"; road = "game-art/fast/road-castle.jpg"; }
    else if (art === "ice") { sky = "game-art/fast/world-plain.jpg"; road = "game-art/fast/road-ghost.jpg"; }
    else if (art === "ghost") { sky = "game-art/fast/world-ghost.jpg"; road = "game-art/fast/road-ghost.jpg"; }
    else if (art === "rainbow") { sky = "game-art/fast/world-rainbow.jpg"; road = "game-art/fast/road-rainbow.jpg"; }
    return { sky: sky, road: road };
  }
  function warmCourse(trackId, driverIds) {
    var t = nvdaTrack(trackId);
    if (!t) return;
    var art = (t.theme && (t.theme.art || t.theme.id)) || "circuit";
    var plates = coursePlates(art);
    need(plates.sky, "high");
    need(plates.road, "high");
    need("game-art/race-pylon.png?v=3", "low");
    (driverIds || []).forEach(function (id) {
      var d = nvdaDriver(id);
      if (d && d.sprite) need(d.sprite, "high");
    });
  }

  function loadCareer() {
    try {
      var raw = JSON.parse(localStorage.getItem("nvda-kart-career") || "null");
      if (raw && raw.tt && raw.cups) return raw;
    } catch (e) {}
    return { unlock150: false, cups: {}, tt: {} };
  }
  function saveCareer() {
    localStorage.setItem("nvda-kart-career", JSON.stringify(career));
  }
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();
  window.addEventListener("keydown", function (e) {
    keys[e.key.toLowerCase()] = true;
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].indexOf(e.key.toLowerCase()) >= 0) e.preventDefault();
    if (!e.repeat && e.key.toLowerCase() === "x" && !split && (phase === "race" || phase === "count")) rearOn = !rearOn;
    if (e.key === "Escape" && (phase === "race" || phase === "count")) {
      if (session && session.mode === "online" && !netHost && NVDA_NET.lobby) {
        NVDA_NET.sendFast(NVDA_NET.lobby.hostId, { t: "pause" });
      } else togglePause();
    }
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("error", function (e) {
    var b = document.getElementById("blurb");
    if (b) b.textContent = e.message || "Something in the race broke.";
  });

  function freshSession() {
    return {
      mode: "gp", cc: "100", driver: 0, p2driver: 1, p2: false,
      cup: "green", trackId: "aisle-circuit", lives: NVDA_PRIX.lives,
      raceIndex: 0, points: NVDA_PRIX.blank(), retry: false, cupOver: false,
      lastPlace: 1, lastOrder: [], ttBest: false, ghost: null, trace: []
    };
  }
  session = freshSession();

  function ccMul() { return NVDA_PRIX.cc[session.cc] || 1; }
  function lapsN() { return session.mode === "battle" ? 99 : NVDA_PRIX.laps; }
  function wrap(d, total) {
    total = total || (track ? track.total : 1);
    d = ((d % total) + total) % total;
    if (d > total / 2) d -= total;
    return d;
  }
  function ord(n) {
    var s = ["th", "st", "nd", "rd"];
    var v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function progress(r) {
    return r.lap * track.total + ((r.s % track.total) + track.total) % track.total;
  }
  function nearFrac(r, frac, window) {
    var target = frac * track.total;
    return Math.abs(wrap(r.s - target)) < window;
  }
  function roster() {
    var all = NVDA_DRIVERS;
    var n = all.length;
    var start = session.driver;
    if (start < 0 || start >= n) start = 0;
    function fill(target, seed) {
      var ids = seed.slice();
      var k = 0;
      while (ids.length < target && k < n * 3) {
        var id = all[(start + k) % n].id;
        if (ids.indexOf(id) < 0) ids.push(id);
        k++;
      }
      return ids;
    }
    if (session.mode === "tt") return [all[start].id];
    if (session.mode === "match") return [all[start].id, all[session.p2driver % n].id];
    if (session.mode === "battle") {
      var seed = [all[start].id];
      if (session.p2) seed.push(all[session.p2driver % n].id);
      return fill(4, seed);
    }
    return fill(Math.min(8, n), [all[start].id]);
  }
  function buildPickups() {
    boxes = [];
    if (session.mode === "tt") return;
    var nBox = track.battle ? 5 : 7;
    var nCoin = track.battle ? 0 : 14;
    var i;
    for (i = 0; i < nBox; i++) {
      boxes.push({ s: track.total * ((i + 0.37) / nBox), lane: i % 2 ? 0.38 : -0.38, cool: 0, coin: false });
    }
    for (i = 0; i < nCoin; i++) {
      boxes.push({ s: track.total * ((i + 0.08) / nCoin), lane: (i % 3 - 1) * 0.28, cool: 0, coin: true });
    }
  }
  function makeRacer(id, index, gap) {
    var d = nvdaDriver(id);
    var human = index === 0 || (index === 1 && (session.mode === "match" || (session.mode === "battle" && session.p2)));
    var lane = 0;
    if (session.mode === "match") lane = index === 0 ? -0.28 : 0.28;
    else if (index > 0) lane = index % 2 ? 0.26 : -0.26;
    return {
      slot: index, driverId: id, name: d.name, hue: d.hue,
      top: d.top, accel: d.accel, grip: d.grip, weight: d.weight,
      you: index === 0, human: human, pad: index === 0 ? 1 : 2,
      s: index * gap, lane: lane, speed: 0,
      coins: session.mode === "tt" || session.mode === "online" ? 0 : session.mode === "match" ? 3 : (index === 0 ? 0 : 1),
      item: null, rolling: 0, rollN: 0, boost: 0, spin: 0, star: 0, small: 0, hop: 0, hopMax: 0, scale: 1,
      lap: 0, finished: false, placeDone: 0, out: false, wasItem: false, hazardCd: 0, touchCd: 0, hold: 0,
      balloons: session.mode === "battle" ? NVDA_BATTLE.balloons : 0,
      remote: false, peerId: null, netIn: null, ack: 0, viewOn: false
    };
  }
  function attachGhost() {
    var g = session.ghost;
    if (session.mode !== "tt" || !g || !g.samples || !g.samples.length) return;
    var ghostDriver = nvdaDriver(g.driverId || racers[0].driverId);
    if (ghostDriver && ghostDriver.sprite) need(ghostDriver.sprite, "high");
    var ghost = makeRacer(g.driverId || racers[0].driverId, racers.length, 0);
    ghost.human = false;
    ghost.you = false;
    ghost.ghost = true;
    ghost.name = g.name || "Ghost";
    ghost.ghostRun = g.samples;
    ghost.s = g.samples[0][1];
    ghost.lane = g.samples[0][2];
    ghost.coins = 0;
    racers.push(ghost);
  }
  function ghostFrame(samples, t) {
    var a = samples[0];
    if (t <= a[0]) return { s: a[1], lane: a[2] };
    var i;
    for (i = 1; i < samples.length; i++) {
      var b = samples[i];
      if (t <= b[0]) {
        var u = (t - a[0]) / ((b[0] - a[0]) || 1);
        return { s: a[1] + (b[1] - a[1]) * u, lane: a[2] + (b[2] - a[2]) * u };
      }
      a = b;
    }
    return { s: a[1], lane: a[2] };
  }
  function noteTrace() {
    if (session.mode !== "tt" || phase !== "race") return;
    var you = youRacer();
    if (!you || you.finished) return;
    if (!session.trace) session.trace = [];
    if (session.trace.length >= 1200) return;
    if (session.traceAt != null && raceT - session.traceAt < 0.1) return;
    session.traceAt = raceT;
    session.trace.push([
      Math.round(raceT * 100) / 100,
      Math.round(you.s * 10) / 10,
      Math.round(you.lane * 1000) / 1000
    ]);
  }
  function ownGhost(trackId) {
    try {
      var all = JSON.parse(localStorage.getItem("nvda-tt-ghosts") || "{}");
      return all[trackId] || null;
    } catch (e) {}
    return null;
  }
  function saveOwnGhost(trackId, pack) {
    var all = {};
    try { all = JSON.parse(localStorage.getItem("nvda-tt-ghosts") || "{}"); } catch (e) {}
    var prev = all[trackId];
    if (prev && prev.time <= pack.time) return;
    all[trackId] = pack;
    try { localStorage.setItem("nvda-tt-ghosts", JSON.stringify(all)); } catch (e2) {}
  }
  function youRacer() {
    var i;
    for (i = 0; i < racers.length; i++) if (racers[i].you) return racers[i];
    return racers[0];
  }
  function racerS(r) { return r && r.viewOn ? r.viewS : r.s; }
  function racerLane(r) { return r && r.viewOn ? r.viewLane : r.lane; }
  function kartFor(r) {
    var d = nvdaDriver(r && r.driverId);
    return need((d && d.sprite) || "game-art/kart-behind.png?v=2");
  }
  function begin() {
    var cupTracks = nvdaCupTracks(session.cup);
    if (session.mode === "gp") session.trackId = cupTracks[session.raceIndex].id;
    track = nvdaTrack(session.trackId);
    var ids = roster();
    warmCourse(track.id, ids);
    var gap = session.mode === "match" ? 12 : session.mode === "battle" ? 28 : Math.min(72, track.total * 0.028);
    racers = ids.map(function (id, i) { return makeRacer(id, i, gap); });
    buildPickups();
    traps = [];
    shots = [];
    count = 3.4;
    raceT = 0;
    ended = false;
    rearOn = false;
    session.trace = [];
    session.traceAt = -1;
    attachGhost();
    if (session.mode === "gp" || session.mode === "online") {
      racers.forEach(function (r, i) { r.coins = coinsForRank(racers.length - i); });
    }
    split = session.mode === "match" || (session.mode === "battle" && session.p2);
    phase = "count";
    document.getElementById("overlay").classList.add("hidden");
    helpFor();
  }
  function helpFor() {
    var p2 = split ? "    P2: arrows, K hop, L item" : "";
    document.getElementById("help").textContent = "W gas · A D steer · S brake · Shift slide · Space item · X behind · Esc pause" + p2;
  }
  function controls(r) {
    if (r.remote) return r.netIn || { gas: false, brake: false, left: false, right: false, hop: false, item: false };
    if (!r.human) return cpuMind(r);
    var solo = !split;
    if (r.pad === 1) {
      return {
        gas: !!(keys["w"] || (solo && keys["arrowup"])),
        brake: !!(keys["s"] || (solo && keys["arrowdown"])),
        left: !!(keys["a"] || (solo && keys["arrowleft"])),
        right: !!(keys["d"] || (solo && keys["arrowright"])),
        hop: !!(keys["shift"]),
        item: !!(keys[" "])
      };
    }
    return {
      gas: !!keys["arrowup"],
      brake: !!keys["arrowdown"],
      left: !!keys["arrowleft"],
      right: !!keys["arrowright"],
      hop: !!keys["k"],
      item: !!keys["l"]
    };
  }
  function cpuMind(r) {
    var aim = Math.sin((r.s + r.slot * 40) * 0.012) * 0.22;
    if (Math.abs(r.lane) > driveHalf() * 0.8) aim = 0;
    var hop = false;
    track.pipes.forEach(function (f) { if (nearFrac(r, f, 34)) hop = true; });
    track.jumps.forEach(function (f) { if (nearFrac(r, f, 28)) hop = true; });
    var close = false;
    racers.forEach(function (o) {
      if (o !== r && !o.out && wrap(o.s - r.s) > 0 && wrap(o.s - r.s) < 90) close = true;
    });
    var use = !!(r.item && r.hold > 1.2 && (close || r.hold > 3.5));
    return { gas: true, brake: false, left: r.lane > aim + 0.04, right: r.lane < aim - 0.04, hop: hop, item: use };
  }
  function blip(freq) {
    try {
      var ac = blip.ac || (blip.ac = new AudioContext());
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = "square";
      o.frequency.value = freq;
      g.gain.value = 0.025;
      o.connect(g); g.connect(ac.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.05);
      o.stop(ac.currentTime + 0.06);
    } catch (e) {}
  }
  function loseBalloon(r) {
    if (r.out || r.star > 0 || session.mode !== "battle") return;
    r.balloons -= 1;
    r.spin = 0.55;
    r.speed *= 0.4;
    blip(180);
    if (r.balloons <= 0) r.out = true;
  }
  function coinsForRank(rank) {
    if (rank <= 2) return 2;
    if (rank <= 4) return 3;
    if (rank <= 6) return 4;
    return 5;
  }
  function payCoins(r, cost) {
    if (r.star > 0 || r.out) return;
    if (session.mode === "battle") { loseBalloon(r); return; }
    if (session.mode === "tt") { r.spin = 0.45; r.speed *= 0.55; return; }
    var had = r.coins;
    r.coins = Math.max(0, had - cost);
    if (had <= 0) r.spin = Math.max(r.spin, 0.65);
    r.speed *= 0.55;
  }
  function bump(r) { payCoins(r, 1); }
  function hitItem(r) { payCoins(r, 4); }
  function useItem(r) {
    if (!r.item || r.rolling > 0 || r.spin > 0 || r.out) return;
    var it = r.item;
    r.item = null;
    blip(520);
    if (it === "boost") r.boost = 1.25;
    else if (it === "star") r.star = 2.4;
    else if (it === "feather") { r.hop = 0.72; r.hopMax = 0.72; }
    else if (it === "cable") traps.push({ s: r.s - 16, lane: r.lane, life: 9 });
    else if (it === "shell") shots.push({ s: r.s + 18, lane: r.lane, life: 2.6, owner: r, home: false });
    else if (it === "home") shots.push({ s: r.s + 18, lane: r.lane, life: 3.4, owner: r, home: true });
    else if (it === "bolt") {
      racers.forEach(function (o) {
        if (o !== r && !o.out) { o.small = 2.1; o.item = null; hitItem(o); }
      });
    } else if (it === "ghost") {
      var best = null;
      var bestD = 1e9;
      racers.forEach(function (o) {
        if (o === r || !o.item) return;
        var d = Math.abs(wrap(o.s - r.s));
        if (d < bestD) { bestD = d; best = o; }
      });
      r.star = 1.1;
      if (best) { r.item = best.item; best.item = null; }
    }
  }
  function hazards(r, dt) {
    r.hazardCd = Math.max(0, r.hazardCd - dt);
    if (r.hazardCd > 0 || r.out) return;
    track.oils.forEach(function (f) {
      if (nearFrac(r, f, 12) && Math.abs(r.lane) < 0.28) {
        r.spin = Math.max(r.spin, 0.22);
        r.speed *= 0.82;
        r.hazardCd = 0.85;
      }
    });
    track.pipes.forEach(function (f) {
      if (nearFrac(r, f, 9) && r.hop < 0.18 && Math.abs(r.lane) < 0.22) {
        r.speed *= 0.72;
        r.spin = Math.max(r.spin, 0.28);
        r.hazardCd = 0.7;
      }
    });
    track.jumps.forEach(function (f) {
      if (nearFrac(r, f, 16) && r.hop < 0.12) { r.hop = 0.48; r.hopMax = 0.48; }
    });
  }
  function groundKind() {
    if (!track || !track.theme) return "sand";
    if (track.theme.surface) return track.theme.surface;
    var id = track.id;
    var theme = track.theme.id;
    if (theme === "rainbow") return "abyss";
    if (theme === "castle") return "lava";
    if (id === "fog-gate") return "ice";
    if (theme === "ghost") return "abyss";
    if (id === "spillway") return "mud";
    if (id === "fan-flats") return "shallows";
    if (theme === "plain") return "grass";
    return "sand";
  }
  function groundMul(kind) {
    if (kind === "sand") return 0.62;
    if (kind === "grass") return 0.55;
    if (kind === "mud") return 0.4;
    if (kind === "shallows") return 0.48;
    if (kind === "ice") return 0.88;
    return 1;
  }
  function rescue(r) {
    if (r.lift > 0) return;
    r.lift = 1.35;
    r.lane = 0;
    r.nose = 0;
    r.slide = 0;
    r.wet = 0;

      if (session.lives <= 0 && session.lastPlace >= 5) blurb = "The cup is over. You finished " + ord(session.lastPlace) + ".";
      else if (session.retry) blurb = ord(session.lastPlace) + ". " + session.lives + " lives left. The course does not count.";
      else if (session.cupOver) blurb = (career.cups[session.cup] ? "You took the cup." : "Someone else took the cup.") + (career.unlock150 ? " 150cc is open." : "");
      else blurb = ord(session.lastPlace) + " on " + track.name + ".";
    } else if (session.mode === "tt") {
      title = "TIME";
      blurb = raceT.toFixed(2) + "s on " + track.name + (session.ttBest ? "  ·  a new best." : "");
    } else if (session.mode === "battle") {
      var win = NVDA_BATTLE.winner(racers);
      title = "BATTLE";
      blurb = win ? win.name + " still has balloons." : "Nobody left.";
    } else if (session.mode === "online") {
      title = "RACE";
      blurb = order[0] ? order[0].name + " takes it." : "";
    } else {
      title = "MATCH";
      blurb = order[0] ? order[0].name + " takes it." : "";
    }
    var table = document.createElement("table");
    table.className = "sheet";
    order.forEach(function (r, i) {
      var tr = document.createElement("tr");
      if (r.you) tr.className = "you";
      var pts = session.mode === "gp" ? session.points[r.slot] : (session.mode === "battle" ? r.balloons : "");
      tr.innerHTML = "<td>" + (i + 1) + "</td><td>" + r.name + "</td><td>" + pts + "</td>";
      table.appendChild(tr);
    });
    document.getElementById("title").textContent = title;
    document.getElementById("blurb").textContent = blurb;
    var box = document.getElementById("choices");
    box.className = "choices";
    box.innerHTML = "";
    box.appendChild(table);
    if (session.mode === "tt") {
      var name = document.createElement("input");
      name.maxLength = 16;
      name.placeholder = "NAME";
      name.setAttribute("aria-label", "Name for the time board");
      name.style.cssText = "letter-spacing:0.12em;font-size:18px;text-transform:uppercase;text-align:center;padding:8px;background:#0c100c;border:1px solid rgba(118,185,0,0.45);width:180px;";
      try { name.value = localStorage.getItem("nvda-tt-name") || ""; } catch (e) {}
      box.appendChild(name);
      box.appendChild(choice("Save time", "Name, track, racer, and the run.", function () { saveTtTime(name.value); }));
      box.appendChild(choice("Board", "Times on this site.", function () { location.href = "tt/index.html"; }));
    }
    if (session.mode === "gp" && session.lives <= 0 && session.lastPlace >= 5) {
      box.appendChild(choice("Back to the desk", "", menuMode));
    } else if (session.mode === "gp" && session.retry) {
      box.appendChild(choice("Retry this course", "", function () { session.retry = false; begin(); }));
      box.appendChild(choice("Quit the cup", "", menuMode));
    } else if (session.mode === "gp" && !session.cupOver) {
      box.appendChild(choice("Next course", "", begin));
      box.appendChild(choice("Quit the cup", "", menuMode));
    } else if (session.mode === "online") {
      if (netHost) box.appendChild(choice("Rematch", "Same room.", function () { NVDA_NET.rematch(); }));
      box.appendChild(choice("Desk", "", function () { NVDA_NET.leave(); menuMode(); }));
    } else {
      box.appendChild(choice("Again", "", begin));
      box.appendChild(choice("Desk", "", menuMode));
    }
    document.getElementById("overlay").classList.remove("hidden");
    phase = "results";
  }
  function togglePause() {
    if (phase === "race" || phase === "count") {
      phase = "pause";
      openMenu("PAUSED", track ? track.name : "", [
        choice("Resume", "", function () {
          phase = count > 0 ? "count" : "race";
          document.getElementById("overlay").classList.add("hidden");
        }),
        choice("Quit", "", menuMode)
      ]);
      phase = "pause";
    }
  }
  function frame(t) {
    var dt = Math.min(0.033, (t - last) / 1000 || 0.016);
    last = t;
    if ((session && session.mode === "online") || phase === "count" || phase === "race") step(dt);
    if (phase !== "menu") paint();
    else if (track && racers.length) paint();
    hud();
    requestAnimationFrame(frame);
  }
  track = nvdaTrack("aisle-circuit");
  racers = [makeRacer(NVDA_DRIVERS[0].id, 0, 0)];
  wireNet();
  menuMode();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
